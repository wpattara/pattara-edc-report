<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F4EF; --card:#FFFFFF; --ink:#20313B; --mut:#64758A;
  --line:#E4E0D6; --teal:#0E6E5C; --tealsoft:#E4F1ED; --red:#B3261E;
  --brass:#A9843F; --gold:#D9B44A;
  /* alias ให้บล็อก DateRange มาตรฐานใช้ชื่อสีเดิมของมันได้ ไม่ต้องแก้โค้ดในสกิล */
  --green:#0E6E5C; --green-dark:#0B5648; --muted:#64758A;
  --sbbg:#0F3D36; --sbtext:#DCE9E5; --sbmut:#8FB0A8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Sarabun',sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
#app{display:flex;min-height:100vh}

/* ---------- sidebar (มาตรฐานกลุ่ม: พื้นเข้ม · ย่อได้ · เมนูผู้ใช้ก้นแถบ) ---------- */
aside{position:relative;width:236px;flex:0 0 236px;background:var(--sbbg);color:var(--sbtext);
  display:flex;flex-direction:column;top:0;height:100vh;transition:width .15s,flex-basis .15s}
@media (max-width:1366px){aside{width:212px;flex-basis:212px}}
aside.mini{width:56px;flex-basis:56px}

/* ปุ่มย่อ/ขยาย — วงกลมลอยคร่อมขอบขวา ระดับเดียวกับชื่อแอป */
.sb-toggle{position:absolute;top:17px;right:-13px;z-index:6;width:26px;height:26px;border-radius:50%;
  background:#E4E8E7;border:1px solid #B9C4C1;color:#12211E;padding:0 0 0 1px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:.15s}
.sb-toggle .ico-chev{width:13px;height:13px;transition:transform .15s}
aside.mini .sb-toggle .ico-chev{transform:rotate(180deg)}
.sb-toggle:hover{background:#fff;color:#000;border-color:var(--brass)}

.brand{display:flex;align-items:center;gap:10px;padding:14px 12px;border-bottom:1px solid rgba(255,255,255,.10)}
.sb-tile{width:32px;height:32px;border-radius:8px;background:var(--gold);color:#3B2A00;flex:none;
  display:flex;align-items:center;justify-content:center}
.sb-tile svg{width:22px;height:22px}
.sb-meta{min-width:0;flex:1}
.sb-name{font-size:13.5px;font-weight:600;color:#fff;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sb-ver{font-size:10.5px;color:var(--sbmut);margin-top:2px;white-space:nowrap}

nav{padding:10px 8px;flex:1;overflow-y:auto}
.navlab{font-size:11px;color:#7FA096;letter-spacing:.6px;margin:10px 8px 4px}
.navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;
  cursor:pointer;font:inherit;font-weight:500;color:var(--sbtext);padding:10px 11px;border-radius:8px;
  margin:2px 0;border-left:3px solid transparent}
.navitem:hover{background:rgba(255,255,255,.07)}
.navitem.on{background:rgba(255,255,255,.13);color:#fff;border-left-color:var(--gold);font-weight:600}
.navitem .ico{opacity:.85}
.navitem .nlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navdiv{border-top:1px solid rgba(255,255,255,.10);margin:10px 6px}
.lockro{width:14px;height:14px;flex:none;opacity:.95;color:var(--brass)}
.ro-note{font-size:10.5px;color:var(--sbmut);line-height:1.45;margin:10px 10px 0;padding-left:8px;
  border-left:2px solid var(--brass)}

/* เมนูผู้ใช้ — ก้นแถบ กางขึ้น */
.sb-account{position:relative;margin-top:auto;border-top:1px solid rgba(255,255,255,.10);padding:10px}
.sb-userbtn{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;cursor:pointer;
  color:var(--sbtext);font:inherit;font-size:12.5px;padding:6px 7px;border-radius:8px;text-align:left}
.sb-userbtn:hover{background:rgba(255,255,255,.07)}
.sb-avatar{width:26px;height:26px;border-radius:50%;background:var(--brass);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center}
.sb-avatar svg{width:15px;height:15px}
.sb-uname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-car{width:14px;height:14px;flex:none;opacity:.8;transform:rotate(180deg);transition:transform .15s}
.sb-account.open .sb-car{transform:rotate(0)}
.sb-umenu{display:none;position:absolute;left:10px;bottom:calc(100% - 4px);z-index:20;min-width:190px;
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px;
  box-shadow:0 8px 28px rgba(0,0,0,.28)}
.sb-account.open .sb-umenu{display:block}
.sb-umenu a,.sb-umenu button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;
  cursor:pointer;font:inherit;font-size:13px;color:var(--ink);padding:9px 10px;border-radius:7px;
  text-decoration:none;text-align:left;white-space:nowrap}
.sb-umenu a:hover,.sb-umenu button:hover{background:#F1F3F2}
.sb-umenu .ico{opacity:.75}
.sb-umenu .udanger{color:#B4372F}
.usep{border-top:1px solid var(--line);margin:4px 2px}

aside.mini .sb-meta,aside.mini .navlab,aside.mini .ro-note,
aside.mini .navitem .nlabel,aside.mini .navitem .lockro,
aside.mini .sb-uname,aside.mini .sb-car{display:none}
aside.mini .brand{justify-content:center;padding:14px 0}
aside.mini .navitem{justify-content:center;padding:10px 0}
aside.mini .sb-userbtn{justify-content:center}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:18px 22px 30px}
.pills{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pill{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--card)}
.pill.ic{width:96px;height:96px;padding:0;border-radius:22px;display:inline-flex;
  flex-direction:column;align-items:center;justify-content:center;gap:6px}
.pill.ic.on{border-width:3px}
.pill.ic.off{opacity:.45;filter:grayscale(.6)}
.pfall{width:40px;height:40px;border-radius:10px;color:#fff;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-size:19px}
.plabel{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1;
  max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.psub{font-size:9px;font-weight:500;color:var(--mut);line-height:1.2;max-width:88px;
  text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pillsrow{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.pillsrow .pills{margin-bottom:0}
.synctop{margin-left:auto;text-align:right;flex-shrink:0}
.synctop #syncInfo{display:block;font-size:11.5px;color:var(--mut);margin-top:6px}

.rangewrap{position:relative;display:inline-block}
.rangebtn{font:inherit;font-size:13px;cursor:pointer;padding:7px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--ink);white-space:nowrap}
.rangebtn:hover{border-color:var(--teal)}
.cal{position:absolute;top:calc(100% + 6px);left:0;z-index:40;width:276px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(32,49,59,.14);padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:13.5px}
.cal-nav{font:inherit;border:1px solid var(--line);background:#fff;border-radius:7px;
  width:28px;height:28px;cursor:pointer;color:var(--mut)}
.cal-nav:hover{color:var(--teal);border-color:var(--teal)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .wd{font-size:10.5px;color:var(--mut);padding:3px 0}
.cal-grid .d{font-size:12.5px;padding:6px 0;border-radius:7px;cursor:pointer;border:1px solid transparent}
.cal-grid .d:hover{background:#F2F0E9}
.cal-grid .d.out{visibility:hidden}
.cal-grid .d.today{border-color:var(--line)}
.cal-grid .d.mid{background:var(--tealsoft);border-radius:0}
.cal-grid .d.sel{background:var(--teal);color:#fff;font-weight:700}
.cal-hint{font-size:11px;color:var(--mut);margin-top:8px;text-align:center}
.tabsbar{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs{display:flex;gap:18px}
.tab{font:inherit;font-size:14px;border:0;background:none;cursor:pointer;color:var(--mut);
  padding:8px 2px;border-bottom:2.5px solid transparent;font-weight:500}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--teal)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:6px}
.seg button{font:inherit;font-size:12.5px;border:0;background:var(--card);color:var(--mut);padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--teal);color:#fff;font-weight:600}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=text],.toolbar input[type=date],.toolbar select{
  font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.toolbar input[type=text]{width:190px}
.toolbar select{max-width:230px}
.chip{font:inherit;font-size:12px;cursor:pointer;border:1px solid var(--line);background:var(--card);
  color:var(--mut);border-radius:999px;padding:5px 11px}
.chip:hover{border-color:var(--teal);color:var(--teal)}
.btn{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:8px;padding:7px 14px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{color:var(--red);border-color:#E7C2BF}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grow{flex:1}
.mini{font:inherit;font-size:12px;cursor:pointer;border:1px solid var(--line);background:#fff;
  border-radius:7px;padding:5px 10px}
.mini.danger{color:var(--red);border-color:#E7C2BF;background:#FBEDEB}
.ico{width:15px;height:15px;flex:none}
.btn.withico{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.withico .ico{opacity:.8}
.btn.pri.withico .ico{opacity:1}
.mini.withico{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600}
.navitem.withico{display:flex;align-items:center;gap:8px}
.navitem.withico .ico{opacity:.75}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.cardm{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--teal);
  border-radius:10px;padding:10px 14px}
.cardm .l{font-size:11.5px;color:var(--mut)}
.cardm .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}

.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:62vh}
table.data{border-collapse:collapse;width:100%;font-size:13px}
table.data thead th{position:sticky;top:0;background:#FBFAF6;border-bottom:1.5px solid var(--line);
  text-align:left;padding:9px 10px;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
table.data thead th.nosort{cursor:default}
table.data tbody td{border-bottom:1px solid #F0EDE4;padding:7px 10px;max-width:260px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
table.data tbody tr:hover{background:#FAF8F2}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.miss{background:#FDEDEC;color:var(--red);font-weight:700}
table.data tfoot td{padding:9px 10px;font-weight:700;background:#F4F7F5;border-top:2px solid var(--teal);
  position:sticky;bottom:0;font-variant-numeric:tabular-nums}

.pager{display:flex;gap:10px;align-items:center;margin-top:10px;color:var(--mut);font-size:12.5px;flex-wrap:wrap}
.pager button{font:inherit;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 10px;cursor:pointer}
.notice{background:#FFF3CD;border:1px solid #E6C34A;border-radius:10px;padding:14px 16px;margin-bottom:12px;color:#7A5D00}
.notice .ico,.hbar .ico{width:16px;height:16px;flex:none;vertical-align:-3px;margin-right:6px}
.notice.err{background:#FDEDEC;border-color:#F1B8B4;color:var(--red)}
.empty{padding:40px;text-align:center;color:var(--mut)}

/* Index editor */
.tedit{border-collapse:collapse;width:100%;font-size:12.5px}
.tedit th{font-weight:600;color:var(--mut);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;background:#FBFAF6;z-index:1}
.tedit td{padding:4px 5px;vertical-align:top;border-bottom:1px solid #F0EDE4}
.tedit input{width:100%;min-width:96px;font:inherit;font-size:12.5px;padding:6px 8px;
  border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.tedit td.rowno{color:var(--mut);font-variant-numeric:tabular-nums;padding-top:10px}

/* ---------- login ---------- */
#dataScreen{display:none}
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:72vh}
.logincard{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:32px 34px;width:340px;text-align:center}
.app-tile{width:72px;height:72px;border-radius:14px;background:var(--paper);padding:8px;margin:0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--brass)}
.app-tile svg{width:100%;height:100%}
.pininp{font-size:22px;letter-spacing:10px;text-align:center;width:190px;padding:10px 6px;
  border:1px solid var(--line);border-radius:10px;font-family:inherit}
.pinrow{display:flex;gap:8px;justify-content:center;align-items:stretch}
.btn-unlock{width:50px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  background:#F1F3F2;color:#3C4A47;border:1px solid #DDE3E1;border-radius:10px;cursor:pointer;padding:0}
.btn-unlock:hover{background:#E7EBEA}
.btn-unlock svg{width:22px;height:22px}
.pinerr{color:var(--red);font-size:12.5px;font-weight:600;margin-top:10px;min-height:17px}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.shake{animation:shake .5s}
.ordiv{display:flex;align-items:center;gap:12px;color:#3C4A47;font-size:14px;font-weight:600;margin:36px 0 16px}
.ordiv::before,.ordiv::after{content:'';flex:1;border-top:1px solid var(--line)}
.ordiv span{display:inline-flex;align-items:center;gap:8px}
.ordiv svg{width:20px;height:20px;flex:none}

/* ---------- settings ---------- */
#settingsScreen{display:none}
.setcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.settings-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mtabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.mtabs button{border:0;background:transparent;padding:8px 13px;font-size:13px;color:var(--mut);
  border-bottom:2px solid transparent;font-family:inherit;cursor:pointer}
.mtabs button.active{color:var(--teal);font-weight:700;border-bottom-color:var(--teal)}
.mtabs button.dirty::after{content:'•';color:var(--red);margin-left:5px;font-weight:700}
.hidden{display:none!important}
.tokchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 10px;
  border-radius:999px;background:var(--tealsoft);color:var(--teal);font-family:ui-monospace,monospace}
.tokchip.none{background:#FDECEA;color:var(--red);font-family:inherit}
.savebar{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.testout{font-size:12.5px;line-height:1.5;margin-top:8px}
.testout.ok{color:var(--teal)} .testout.bad{color:var(--red)}
.rdonly{font-family:ui-monospace,monospace;font-size:13px;color:var(--mut)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.sec h3{margin:0 0 10px;font-size:15px}
.sec .hint{font-size:12px;color:var(--mut);margin:-6px 0 10px}
.sin{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.frow label{font-size:12.5px;color:var(--mut);min-width:90px}
.wide{flex:1;min-width:220px}

#overlay{position:fixed;inset:0;background:rgba(246,244,239,.75);display:none;
  align-items:center;justify-content:center;z-index:50;font-weight:600;color:var(--teal)}
#overlay .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 26px;
  display:flex;gap:12px;align-items:center}
.spin{width:18px;height:18px;border:3px solid var(--tealsoft);border-top-color:var(--teal);
  border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--red);color:#fff;
  padding:10px 18px;border-radius:10px;display:none;z-index:60;max-width:80vw}
#toast.ok{background:var(--teal)}

/* ═══ DatePicker — ปฏิทินเดียว จิ้มวันเดียว/ช่วงวัน (สกิล date-picker) ═══ */
.dr-wrap{position:relative;display:inline-block}
.dr-btn{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;background:#fff;border:1.4px solid var(--line);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.dr-btn:hover{border-color:var(--green)}
.dr-btn.empty{color:var(--muted)}
.dr-btn .dr-ico{width:16px;height:16px;flex:none;color:var(--green)}
.dr-pop{display:none;position:fixed;top:0;left:0;z-index:200;width:300px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 10px 28px rgba(16,44,38,.16)}
.dr-pop.open{display:block}
.dr-quick{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.dr-quick button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-family:inherit;font-size:12px;color:var(--muted);cursor:pointer}
.dr-quick button:hover{border-color:var(--green);color:var(--green)}
.dr-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dr-head b{font-size:14px}
.dr-nav{border:none;background:none;cursor:pointer;color:var(--muted);font-size:17px;line-height:1;padding:3px 9px;border-radius:6px}
.dr-nav:hover{background:#F1F5F4;color:var(--ink)}
.dr-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dr-dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.dr-day{text-align:center;font-size:13px;padding:6px 0;border-radius:7px;cursor:pointer;border:1px solid transparent;user-select:none}
.dr-day:hover{background:#EDF4F2}
.dr-day.out{color:#C4CDCA}
.dr-day.dis{color:#D3D9D6;cursor:not-allowed}
.dr-day.dis:hover{background:transparent}
.dr-day.today{border-color:var(--green);font-weight:600}
.dr-day.in{background:#E4F0EC;border-radius:0}
.dr-day.edge{background:var(--green);color:#fff;font-weight:600}
.dr-day.edge.start{border-radius:7px 0 0 7px}
.dr-day.edge.end{border-radius:0 7px 7px 0}
.dr-day.edge.only{border-radius:7px}
.dr-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.dr-sum{flex:1;min-width:0;font-size:12px;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-clear{flex:none;border:none;background:none;padding:0;font-family:inherit;font-size:12px;color:var(--muted);text-decoration:underline;cursor:pointer}
.dr-clear:hover{color:var(--green)}
.dr-apply{background:var(--green);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-family:inherit;font-size:13px;cursor:pointer;flex:none}
.dr-apply:hover{background:var(--green-dark)}

/* ---------- print ---------- */
#printArea{display:none}
@media print{
  body>#app,#overlay,#toast{display:none!important}
  body{background:#fff}
  #printArea{display:block;font-size:11px}
  #printArea h2{margin:0 0 2px;font-size:16px}

/* ---------- helpers ---------- */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

    return v.toLocaleString('en-US',{minimumFractionDigits:isInt?0:2, maximumFractionDigits:2});

}

/* ═══════════════════════════════════════════════════════════════
 * DateRange — ตัวเลือกวัน/ช่วงวัน ปฏิทินเดือนเดียว (สกิล date-picker · ต้นแบบจากระบบเดลิเวอรี่)
 *   แสดง พ.ศ. (opts.year='ce' = ค.ศ.) · ส่งค่า ค.ศ. yyyy-MM-dd เสมอ
 *   opts.mode  'filter' (ตั้งต้น: มีปุ่ม "ทั้งหมด" คืน {from:'',to:''}) | 'pick' (ช่องกรอก: ไม่มีทั้งหมด **ไม่มีปุ่มลัด** — เจ้าของเคาะ 08/09/2569 · ใส่ opts.quick เองถ้าจำเป็น)
 *   opts.single true = จิ้มวันเดียวแล้วใช้ทันที (from=to) · opts.min / opts.max 'yyyy-MM-dd' จิ้มนอกช่วงไม่ได้
 *   opts.placeholder ข้อความตอนยังไม่เลือก · opts.clearable ปุ่ม "ล้าง" ใน mode pick · opts.align 'right'
 *   opts.from/opts.to ค่าเริ่ม ('' ได้) · opts.onApply(range) ยิงตอนกด "ใช้ช่วงนี้" หรือปุ่มลัด เท่านั้น
 *   ป๊อปอัปเป็น position:fixed วางตามตำแหน่งปุ่ม (CRM 08/09/2569: การ์ดฟอร์มมี overflow:hidden บังปฏิทินครึ่งใบ) — พลิกขึ้นบนเองถ้าชิดขอบล่าง เลื่อนหน้าแล้วตามปุ่ม
 * บทเรียนที่ห้ามถอย (เดลิเวอรี่ 03/09/2569):
 *   1) คลิกในป๊อปอัปต้อง stopPropagation ไม่งั้นตัวเช็ค "คลิกนอกกรอบ" ปิดปฏิทินทุกครั้งที่จิ้ม (node ถูก render ใหม่)
 *   2) hover/จิ้มวัน ให้ paintDays() ทาสีเฉย ๆ ห้าม render() ใหม่ทั้งกริด ไม่งั้น mouseenter วนไม่จบ คลิกไม่ติด
 * ═══════════════════════════════════════════════════════════════ */
var DateRange = (function () {
  var MONTH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  var MON_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var DOW = ['อา','จ','อ','พ','พฤ','ศ','ส'];
  var ICON = '<svg class="dr-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>';

  function pad(n){ return (n<10?'0':'')+n; }
  function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parse(s){ var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(Number(m[1]),Number(m[2])-1,Number(m[3])) : null; }
  function todayYmd(){ return ymd(new Date()); }
  function shift(days){ var d=new Date(); d.setDate(d.getDate()+days); return ymd(d); }
  function yearOf(d, ce){ return d.getFullYear() + (ce ? 0 : 543); }
  /** 'yyyy-MM-dd' → '24 ส.ค. 2569' (ce=true → 24/08/2026) */
  function fmt(s, ce){
    var d=parse(s); if(!d) return '';
    return ce ? pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear() : d.getDate()+' '+MON_SHORT[d.getMonth()]+' '+yearOf(d, ce);
  }
  function label(from, to, ce, placeholder){
    if(!from && !to) return placeholder || 'ทุกช่วงเวลา';
    if(from && to && from===to) return fmt(from, ce);
    if(from && !to) return 'ตั้งแต่ '+fmt(from, ce);
    if(!from && to) return 'ถึง '+fmt(to, ce);
    var a=parse(from), b=parse(to);
    if(!ce && a && b && a.getMonth()===b.getMonth() && a.getFullYear()===b.getFullYear()) return a.getDate()+' – '+fmt(to, ce);
    return fmt(from, ce)+' – '+fmt(to, ce);
  }
  function lastDays(n){ var end=new Date(), start=new Date(); start.setDate(start.getDate()-(Number(n||7)-1)); return {from:ymd(start), to:ymd(end)}; }
  function thisMonth(){ var n=new Date(); return {from:ymd(new Date(n.getFullYear(), n.getMonth(), 1)), to:todayYmd()}; }

  function attach(btn, opts){
    opts = opts || {};
    var mode = opts.mode || 'filter', ce = opts.year === 'ce';
    var def = mode === 'pick' ? {from:'', to:''} : lastDays(7);
    var state = { from: opts.from!==undefined ? opts.from : def.from, to: opts.to!==undefined ? opts.to : def.to };
    var draft = { from:state.from, to:state.to, picking:false, hover:'' };
    var view = parse(state.from) || new Date(); view = new Date(view.getFullYear(), view.getMonth(), 1);
    var min = opts.min || '', max = opts.max || '';
    var quick = opts.quick || (mode === 'pick' ? [] : [['วันนี้', 'today'], ['7 วัน', '7d'], ['เดือนนี้', 'month'], ['เดือนก่อน', 'prev'], ['ทั้งหมด', 'all']]);

    var wrap=document.createElement('span'); wrap.className='dr-wrap';
    btn.parentNode.insertBefore(wrap, btn); wrap.appendChild(btn);
    var pop=document.createElement('div'); pop.className='dr-pop';
    wrap.appendChild(pop);
    pop.addEventListener('click', function(e){ e.stopPropagation(); });   // บทเรียนข้อ 1
    btn.classList.add('dr-btn'); btn.type='button';
    paintButton();

    btn.addEventListener('click', function(e){ e.stopPropagation(); if(pop.classList.contains('open')) close(); else open(); });
    document.addEventListener('click', function(e){ if(pop.classList.contains('open') && !wrap.contains(e.target)) close(); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape' && pop.classList.contains('open')) close(); });

    function allowed(s){ return !(min && s<min) && !(max && s>max); }
    function open(){
      draft={from:state.from, to:state.to, picking:false, hover:''};
      var base=parse(state.from) || (min && parse(min) > new Date() ? parse(min) : new Date());
      view=new Date(base.getFullYear(), base.getMonth(), 1);
      pop.classList.add('open'); render(); place();
    }
    function close(){ pop.classList.remove('open'); }
    // วางป๊อปอัปใต้ปุ่ม (fixed) — ไม่ถูก overflow ของกรอบแม่บัง · ชิดขอบล่างให้พลิกขึ้น · ชิดขอบขวาให้ขยับซ้าย
    function place(){
      if(!pop.classList.contains('open')) return;
      var r=btn.getBoundingClientRect(), ph=pop.offsetHeight||360, pw=pop.offsetWidth||300;
      var top=r.bottom+6; if(top+ph>window.innerHeight-8) top=Math.max(8, r.top-6-ph);
      var left=(opts.align==='right') ? r.right-pw : r.left; if(left+pw>window.innerWidth-8) left=Math.max(8, window.innerWidth-8-pw);
      pop.style.top=top+'px'; pop.style.left=Math.max(8,left)+'px';
    }
    window.addEventListener('scroll', place, true);
    window.addEventListener('resize', place);
    function paintButton(){
      var empty=!state.from && !state.to;
      btn.classList.toggle('empty', !!(empty && opts.placeholder));
      btn.innerHTML = ICON+'<span>'+label(state.from, state.to, ce, opts.placeholder)+'</span>';
    }
    function apply(from, to){ state.from=from; state.to=to; paintButton(); close(); if(opts.onApply) opts.onApply({from:state.from, to:state.to}); }
    function runQuick(v){
      var now=new Date(), a, b;
      if(typeof v==='number'){ a=b=shift(v); }
      else if(v==='today'){ a=b=todayYmd(); }
      else if(v==='7d'){ var r=lastDays(7); a=r.from; b=r.to; }
      else if(v==='month'){ a=ymd(new Date(now.getFullYear(), now.getMonth(), 1)); b=ymd(new Date(now.getFullYear(), now.getMonth()+1, 0)); }
      else if(v==='prev'){ a=ymd(new Date(now.getFullYear(), now.getMonth()-1, 1)); b=ymd(new Date(now.getFullYear(), now.getMonth(), 0)); }
      else { a=''; b=''; }
      if(a && !allowed(a)) return;
      apply(a, b);
    }
    function pick(s){
      if(!allowed(s)) return;
      if(opts.single){ draft.from=s; draft.to=s; draft.picking=false; apply(s, s); return; }
      if(!draft.picking){ draft.from=s; draft.to=s; draft.picking=true; draft.hover=s; }
      else { if(s<draft.from){ draft.to=draft.from; draft.from=s; } else draft.to=s; draft.picking=false; draft.hover=''; }
      paintDays();   // บทเรียนข้อ 2
    }
    function classesFor(s, lo, hi, today, mo){
      var cls='dr-day';
      if(Number(s.slice(5,7))-1!==mo) cls+=' out';
      if(!allowed(s)) cls+=' dis';
      if(s===today) cls+=' today';
      if(lo && hi && s>lo && s<hi) cls+=' in';
      if(s===lo || s===hi){ cls+=' edge'; if(lo===hi) cls+=' only'; else if(s===lo) cls+=' start'; else cls+=' end'; }
      return cls;
    }
    function range(){
      var lo=draft.from, hi=draft.to;
      if(draft.picking && draft.hover){ lo = draft.hover<draft.from ? draft.hover : draft.from; hi = draft.hover<draft.from ? draft.from : draft.hover; }
      return [lo, hi];
    }
    function paintDays(){
      var r=range(), today=todayYmd(), mo=view.getMonth();
      Array.prototype.forEach.call(pop.querySelectorAll('[data-d]'), function(c){ c.className=classesFor(c.getAttribute('data-d'), r[0], r[1], today, mo); });
      var sum=pop.querySelector('.dr-sum');
      if(sum) sum.textContent = draft.picking ? 'เลือกวันสิ้นสุด… (จิ้มวันเดิม = วันเดียว)' : label(draft.from, draft.to, ce, opts.placeholder);
    }
    function render(){
      var y=view.getFullYear(), mo=view.getMonth(), startIdx=new Date(y, mo, 1).getDay(), today=todayYmd(), r=range();
      var html='';
      if(quick.length){
        html+='<div class="dr-quick">'+quick.map(function(q, i){ return '<button type="button" data-q="'+i+'">'+q[0]+'</button>'; }).join('')+'</div>';
      }
      html+='<div class="dr-head"><button type="button" class="dr-nav" data-nav="-1">&#8249;</button><b>'+MONTH[mo]+' '+(ce?y:y+543)+'</b><button type="button" class="dr-nav" data-nav="1">&#8250;</button></div>'
        +'<div class="dr-grid">'+DOW.map(function(d){ return '<div class="dr-dow">'+d+'</div>'; }).join('');
      for(var i=0;i<42;i++){
        var d=new Date(y, mo, 1-startIdx+i), s=ymd(d);
        html+='<div class="'+classesFor(s, r[0], r[1], today, mo)+'" data-d="'+s+'">'+d.getDate()+'</div>';
        if(i>=34 && d.getMonth()!==mo && (i+1)%7===0) break;
      }
      html+='</div><div class="dr-foot">'
        +(mode==='pick' ? (opts.clearable ? '<button type="button" class="dr-clear">ล้าง</button>' : '') : '<button type="button" class="dr-clear">ทั้งหมด</button>')
        +'<span class="dr-sum">'+(draft.picking ? 'เลือกวันสิ้นสุด… (จิ้มวันเดิม = วันเดียว)' : label(draft.from, draft.to, ce, opts.placeholder))+'</span>'
        +(opts.single ? '' : '<button type="button" class="dr-apply">ใช้ช่วงนี้</button>')+'</div>';
      pop.innerHTML=html;
      var clr=pop.querySelector('.dr-clear'); if(clr) clr.addEventListener('click', function(){ apply('', ''); });
      Array.prototype.forEach.call(pop.querySelectorAll('[data-q]'), function(b){ b.addEventListener('click', function(){ runQuick(quick[Number(b.getAttribute('data-q'))][1]); }); });
      Array.prototype.forEach.call(pop.querySelectorAll('[data-nav]'), function(b){ b.addEventListener('click', function(){ view=new Date(view.getFullYear(), view.getMonth()+Number(b.getAttribute('data-nav')), 1); render(); }); });
      Array.prototype.forEach.call(pop.querySelectorAll('[data-d]'), function(c){
        c.addEventListener('click', function(){ pick(c.getAttribute('data-d')); });
        c.addEventListener('mouseenter', function(){ var s=c.getAttribute('data-d'); if(draft.picking && draft.hover!==s){ draft.hover=s; paintDays(); } });
      });
      var ap=pop.querySelector('.dr-apply'); if(ap) ap.addEventListener('click', function(){ apply(draft.from, draft.to); });
      place();
    }
    return {
      get: function(){ return {from:state.from, to:state.to}; },
      set: function(from, to){ state.from=from||''; state.to=to||''; paintButton(); },
      setMin: function(m){ min=m||''; }
    };
  }
  return { attach:attach, fmt:fmt, label:label, today:todayYmd, lastDays:lastDays, thisMonth:thisMonth };
})();

/* ---------- ชื่อแอปต้องอยู่บรรทัดเดียว ย่อขนาดแทนการตัดบรรทัด ---------- */
function fitAppName(){
  var el = $('appName'); if (!el || !el.offsetParent) return;   // แถบย่ออยู่ วัดไม่ได้
  var box = el.parentNode; if (!box || !box.clientWidth) return;
  var size = 13.5;
  el.style.fontSize = size + 'px';
  while (el.scrollWidth > box.clientWidth && size > 10){ size -= 0.5; el.style.fontSize = size + 'px'; }
  el.title = el.scrollWidth > box.clientWidth ? el.textContent : '';
}

/* ---------- filtering / summarising (client-side เหมือน OCR) ---------- */
function filteredRows(){
  var t = tabObj();
  var si = (t && t.storeCol) ? S.headers.indexOf(t.storeCol) : -1;
  var store = $('store').value;
  var q = $('q').value.trim().toLowerCase();
  return S.rows.filter(function(r){
    if (store && si>=0 && String(r[si])!==store) return false;
    if (q){
      var hit=false;
      for (var i=0;i<r.length;i++){
        if (String(r[i]).toLowerCase().indexOf(q)>=0){ hit=true; break; }
      }
      if (!hit) return false;
    }
    return true;
  });
}
function sumColsPresent(){
  var t = tabObj();
  return (t && t.sum ? t.sum : []).map(function(name){
    return { name:name, idx:S.headers.indexOf(name) };
  }).filter(function(c){ return c.idx>=0; });
}
function groupSummary(rows, mode){   // mode: 'daily' | 'branch'
  var t = tabObj();
  var gi = mode==='branch' ? (t ? S.headers.indexOf(t.storeCol) : -1)
                           : (t ? S.headers.indexOf(t.dateCol) : -1);
  var sums = sumColsPresent();
  var map = {}, order = [];
  rows.forEach(function(r){
    var g0 = gi>=0 ? String(r[gi]) : '(ไม่ระบุ)';
    var k = mode==='daily' ? g0.slice(0,10) : (g0||'(ว่าง)');
    if (!map[k]){ map[k] = { k:k, n:0, s:sums.map(function(){return 0;}) }; order.push(k); }
    var g = map[k]; g.n++;
    sums.forEach(function(c,i){ var v=r[c.idx]; if (typeof v==='number') g.s[i]+=v; });
  });
  var list = order.map(function(k){ return map[k]; });
  if (mode==='daily') list.sort(function(a,b){ return (dateKey(b.k)||0)-(dateKey(a.k)||0); });
  else list.sort(function(a,b){ return a.k<b.k?-1:1; });
  return { sums:sums, list:list };
}

function renderCards(){
  var rows = filteredRows();
  var sums = sumColsPresent();
  var html = '<div class="cardm"><div class="l">จำนวนรายการ (ตามตัวกรอง)</div><div class="v">'+
    rows.length.toLocaleString()+'</div></div>';
  sums.slice(0,4).forEach(function(c){
    var tot=0;
    rows.forEach(function(r){ var v=r[c.idx]; if(typeof v==='number') tot+=v; });
    html += '<div class="cardm"><div class="l">รวม '+esc(c.name)+'</div><div class="v">'+fmtMoney(tot)+'</div></div>';
  });
  $('cards').innerHTML = html;
}
function isNumCol(i){
  for (var r=0;r<Math.min(S.rows.length,50);r++){
    var v=S.rows[r][i];
    if (v!=='' && v!=null){ return typeof v==='number'; }
  }
  return false;
}
function storeIdx_(){
  var t = tabObj();
  return (t && t.storeCol) ? S.headers.indexOf(t.storeCol) : -1;
}
function renderTable(){
  var tbl = $('tbl');
  if (!S.headers.length){
    tbl.innerHTML='<tbody><tr><td class="empty">— ไม่มีข้อมูล —</td></tr></tbody>';
    $('pager').innerHTML='';
    return;
  }

  if (S.view==='daily' || S.view==='branch'){
    var rows = filteredRows();
    var ds = groupSummary(rows, S.view);
    var gname = S.view==='daily' ? 'วันที่' : 'สาขา';
    var head = '<thead><tr><th class="nosort">'+gname+'</th><th class="nosort num">จำนวนรายการ</th>'+
      ds.sums.map(function(c){return '<th class="nosort num">'+esc(c.name)+'</th>';}).join('')+'</tr></thead>';
    var body = '<tbody>'+ ds.list.map(function(g){
      var label = S.view==='branch' ? branchLabel(g.k) : g.k;
      return '<tr><td>'+esc(label)+'</td><td class="num">'+g.n.toLocaleString()+'</td>'+
        g.s.map(function(v){return '<td class="num">'+fmtMoney(v)+'</td>';}).join('')+'</tr>';
    }).join('') + '</tbody>';
    var tot = ds.sums.map(function(c,i){
      var s=0; ds.list.forEach(function(g){s+=g.s[i];}); return s;
    });
    var nAll=0; ds.list.forEach(function(g){nAll+=g.n;});
    var foot = '<tfoot><tr><td>รวมทั้งหมด</td><td class="num">'+nAll.toLocaleString()+'</td>'+
      tot.map(function(v){return '<td class="num">'+fmtMoney(v)+'</td>';}).join('')+'</tr></tfoot>';
    tbl.innerHTML = head+body+foot;
    $('pager').innerHTML = ds.list.length.toLocaleString()+(S.view==='daily'?' วัน':' สาขา')+
      ' · จาก '+rows.length.toLocaleString()+' รายการ · โหลด '+S.rows.length.toLocaleString()+
      ' แถว ('+(S.ms/1000).toFixed(1)+' วิ)'+(S.latest ? ' · ข้อมูลถึง '+esc(S.latest.disp) : '');
    return;
  }

  var rows2 = filteredRows();
  if (S.sortIdx>=0){
    var i=S.sortIdx, dir=S.sortDir, numeric=isNumCol(i);
    rows2 = rows2.slice().sort(function(a,b){
      var x=a[i], y=b[i];
      if (numeric){ x=(typeof x==='number')?x:-Infinity; y=(typeof y==='number')?y:-Infinity; return (x-y)*dir; }
      var dx=dateKey(x), dy=dateKey(y);
      if (dx!=null && dy!=null) return (dx-dy)*dir;
      return String(x).localeCompare(String(y),'th')*dir;
    });
  }

  var pages = Math.max(1, Math.ceil(rows2.length/S.per));
  if (S.page>pages) S.page=pages;
  var start=(S.page-1)*S.per, slice=rows2.slice(start,start+S.per);
  var si = storeIdx_();

  var head = '<thead><tr>'+S.headers.map(function(h,i){
    var arrow = i===S.sortIdx ? (S.sortDir>0?' \u2191':' \u2193') : '';
    return '<th class="'+(isNumCol(i)?'num':'')+'" data-i="'+i+'">'+esc(h)+arrow+'</th>';
  }).join('')+'</tr></thead>';

  var body = '<tbody>'+ slice.map(function(r){
    return '<tr>'+ r.map(function(v,i){
      var isN = typeof v==='number';
      var s = fmt(v);
      if (i===si && String(v)===''){
        return '<td class="miss" title="ยังไม่ได้จับคู่สาขาใน Index">— ว่าง —</td>';
      }
      return '<td class="'+(isN?'num':'')+'" title="'+s+'">'+s+'</td>';
    }).join('')+'</tr>';
  }).join('') + (slice.length?'':'<tr><td class="empty" colspan="'+S.headers.length+'">'+emptyMsg()+'</td></tr>') + '</tbody>';

  tbl.innerHTML = head+body;
  Array.prototype.forEach.call(tbl.querySelectorAll('thead th'), function(th){
    th.onclick = function(){
      var i=+th.getAttribute('data-i');
      if (S.sortIdx===i) S.sortDir*=-1; else { S.sortIdx=i; S.sortDir=1; }
      S.page=1; renderTable();
    };
  });

  var pg = $('pager');
  pg.innerHTML =
    '<button id="pgPrev">‹ ก่อนหน้า</button>'+
    '<span>หน้า '+S.page+' / '+pages+'</span>'+
    '<button id="pgNext">ถัดไป ›</button>'+
    '<span>· ตามตัวกรอง '+rows2.length.toLocaleString()+' รายการ · โหลด '+
    S.rows.length.toLocaleString()+' แถว ('+(S.ms/1000).toFixed(1)+' วิ)'+
    (S.latest ? ' · ข้อมูลถึง '+esc(S.latest.disp) : '')+'</span>';
  $('pgPrev').onclick=function(){ if(S.page>1){S.page--;renderTable();} };
  $('pgNext').onclick=function(){ if(S.page<pages){S.page++;renderTable();} };
}

/* ---------- export (ทุกทางผ่านด่านตรวจค่าว่าง) ---------- */
function blockToastIfNeeded(){
  if (!exportsBlocked()) return false;
  toast('Export ถูกปิดชั่วคราว — ข้อมูลใน query ยังไม่ครบ ให้จับคู่สาขาในแท็บ Index แล้วตรวจซ้ำก่อน');
  return true;
}
function exportDataset(){
  if (S.view==='daily' || S.view==='branch'){
    var ds = groupSummary(filteredRows(), S.view);
    var gname = S.view==='daily' ? 'วันที่' : 'สาขา';
    var headers = [gname,'จำนวนรายการ'].concat(ds.sums.map(function(c){return c.name;}));
    var rows = ds.list.map(function(g){
      var label = S.view==='branch' ? branchLabel(g.k) : g.k;
      return [label, g.n].concat(g.s.map(function(v){return Math.round(v*100)/100;}));
    });
    var tot=['รวมทั้งหมด', ds.list.reduce(function(a,g){return a+g.n;},0)]
      .concat(ds.sums.map(function(c,i){
        return Math.round(ds.list.reduce(function(a,g){return a+g.s[i];},0)*100)/100;
      }));
    rows.push(tot);
    return { headers:headers, rows:rows };
  }
  return { headers:S.headers.slice(), rows:filteredRows() };
}
function ddmmyyyy(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));
  return m ? (m[3]+'-'+m[2]+'-'+m[1]) : '';
}
function baseFileName(){
  var p = srcObj();
  var label = (p && p.fileLabel) || '';
  var kind = S.tab==='raw' ? 'ข้อมูลดิบ' : (S.tab==='index' ? 'Index' : 'ขึ้นเงิน');
  var f = $('from').value, to = $('to').value, range;
  if (S.tab==='index') range = '';
  else if (f && to) range = (f === to) ? ddmmyyyy(f) : (ddmmyyyy(f)+' ถึง '+ddmmyyyy(to));
  else if (f)  range = 'ตั้งแต่ '+ddmmyyyy(f);
  else if (to) range = 'ถึง '+ddmmyyyy(to);
  else         range = 'ทั้งหมด';
  var name = (label+' '+kind+' '+range).replace(/\s+$/,'');
  if (S.view === 'daily') name += ' (สรุปรายวัน)';
  else if (S.view === 'branch') name += ' (สรุปรายสาขา)';
  return name;
}
function fileName(ext){ return baseFileName()+'.'+ext; }
function download(blob, name){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},2000);
}
function exportCsv(){
  if (blockToastIfNeeded()) return;
  var d=exportDataset();
  var lines=[d.headers].concat(d.rows).map(function(r){
    return r.map(function(v){
      var s=String(v==null?'':v);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',');
  });
  download(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}), fileName('csv'));
}
function xlsxTabName(n){
  // ข้อจำกัดชื่อแท็บ Excel: ห้าม [ ] * ? / \ : และยาวได้ไม่เกิน 31 ตัว
  n = String(n||'').replace(/[\[\]\*\?\/\\:]/g,' ').replace(/\s+/g,' ').trim().slice(0,31);
  return n || 'data';
}
function exportXlsx(){
  if (blockToastIfNeeded()) return;
  var go=function(){
    var d=exportDataset();
    var ws=XLSX.utils.aoa_to_sheet([d.headers].concat(d.rows));
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, xlsxTabName(tabObj() && tabObj().sheet));
    XLSX.writeFile(wb, fileName('xlsx'));
  };
  if (window.XLSX){ go(); return; }
  overlay(true,'กำลังโหลดตัวสร้างไฟล์ Excel…');
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=function(){ overlay(false); go(); };
  s.onerror=function(){ overlay(false); toast('โหลดไลบรารี Excel ไม่สำเร็จ — ใช้ปุ่ม CSV แทนได้'); };
  document.head.appendChild(s);
}
function doPrint(){
  if (blockToastIfNeeded()) return;
  var d=exportDataset();
  var t=tabObj();
  var meta=[
    srcObj()?srcObj().label+' · '+srcObj().sublabel:'',
    (S.view==='daily'?'สรุปรายวัน':(S.view==='branch'?'สรุปรายสาขา':(t?t.label:''))),
    'ช่วง '+DateRange.label($('from').value, $('to').value),
    $('store').value?('สาขา: '+$('store').value):'',
    $('q').value?('ค้นหา: "'+$('q').value+'"'):'',
    'พิมพ์เมื่อ '+new Date().toLocaleString('th-TH')
  ].filter(Boolean).join(' · ');
  var numCols = d.headers.map(function(h,i){
    for (var r=0;r<Math.min(d.rows.length,50);r++){
      var v=d.rows[r][i]; if(v!==''&&v!=null) return typeof v==='number';
    }
    return false;
  });
  var html='<h2>ระบบขึ้นเงินบัตรเครดิต EDC</h2><div class="pm">'+esc(meta)+'</div>'+
    '<table><thead><tr>'+d.headers.map(function(h,i){
      return '<th class="'+(numCols[i]?'num':'')+'">'+esc(h)+'</th>';
    }).join('')+'</tr></thead><tbody>'+
    d.rows.map(function(r){
      return '<tr>'+r.map(function(v,i){
        return '<td class="'+(numCols[i]?'num':'')+'">'+fmt(v)+'</td>';
      }).join('')+'</tr>';
    }).join('')+'</tbody></table>';
  $('printArea').innerHTML=html;
  var prevTitle = document.title;
  document.title = baseFileName();
  window.print();
  setTimeout(function(){ document.title = prevTitle; }, 1500);
}

function startRebuildFlow(){
  var k = S.src, p = srcObj();
  var formula = !!(p && p.queryMode === 'formula');
  var warn = formula
    ? 'สั่งให้แท็บ query ของชิปนี้คำนวณสูตรใหม่?\n\n' +
      'แท็บนี้เป็น ARRAYFORMULA — ระบบจะเขียนสูตรเดิมทับตัวเองเพื่อบังคับคำนวณ ไม่มีข้อมูลถูกแก้'
    : 'สร้างแท็บ query ใหม่ทั้งแท็บ?\n\n' +
      'ระบบจะล้างแถวเดิมในแท็บ query แล้วประกอบใหม่จากข้อมูลดิบ + Index ปัจจุบัน\n' +

  $('btnRebuild').disabled = true;
  overlay(true, formula ? 'กำลังสั่งให้สูตรในแท็บ query คำนวณใหม่…'
                        : 'กำลังสร้างตาราง query ใหม่จากข้อมูลดิบ + Index…');
  google.script.run
    .withSuccessHandler(function(res){
      overlay(false); $('btnRebuild').disabled=false;
      if (res && res.ok){
        var n = (res.rebuilt == null) ? '-' : res.rebuilt;
        toast(res.mode==='formula'
          ? ('สั่งคำนวณสูตรใหม่แล้ว แท็บ query มี '+n+' แถว')
          : ('สร้างตาราง query ใหม่แล้ว '+n+' แถว'), true);
        if (res.unknownMerchants && res.unknownMerchants.length){
          toast('ยังมี MERCHANT_ID ที่ไม่มีใน Index '+res.unknownMerchants.length+
                ' รายการ: '+res.unknownMerchants.slice(0,5).join(', ')+
                (res.unknownMerchants.length>5?' …':''));

        if (S.src===k){
          HEALTH = res.health || HEALTH;    // แบนเนอร์แดง/ปุ่ม export ต้องสะท้อนผลใหม่
          renderHealth();
          loadData();
        }
      } else if (res && res.reason==='cooldown'){
        toast('เพิ่งสั่งไปเมื่อครู่ — รออีก '+(res.waitSec||0)+' วินาที');
      } else {
        toast((res && res.message) || 'สร้างตาราง query ใหม่ไม่สำเร็จ');
      }
    })
    .withFailureHandler(function(e){
      overlay(false); $('btnRebuild').disabled=false;
      toast('สร้างตาราง query ใหม่ไม่สำเร็จ: '+(e&&e.message?e.message:e));
    })
    .startRebuild(S.pin, k);
}

/* ---------- ปฏิทินเลือกช่วง (อันเดียว: จิ้มวันเริ่ม → จิ้มวันสิ้นสุด) ---------- */
var CAL = { open:false, y:0, m:0, pickFrom:'', pickTo:'' };   // m = 0-11
var TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

/* ปฏิทินช่วงวัน: ใช้บล็อก DateRange มาตรฐาน (สกิล date-picker) ที่ฝังไว้ด้านบน
   ของเดิมเขียนเอง วาดกริดใหม่ทั้งใบทุกครั้งที่จิ้ม ซึ่งเป็นบั๊กที่สกิลสั่งห้าม */
var RANGE = null;

function currentRange(){ return RANGE ? RANGE.get() : { from: $('from').value, to: $('to').value }; }

/** ตั้งช่วงเป็น "ทั้งเดือน" ของวันที่ที่ส่งมา แล้วดึงข้อมูลทันที */
/** ข้อความตอนไม่พบรายการ — บอกช่วงที่กรองอยู่เสมอ เพราะสาเหตุที่พบบ่อยสุดคือช่วงวัน ไม่ใช่ไม่มีข้อมูล */
function emptyMsg(){
  var r = currentRange();
  if (!r.from && !r.to) return 'ไม่พบรายการตามเงื่อนไขที่เลือก';
  return 'ไม่พบรายการในช่วง ' + esc(DateRange.label(r.from, r.to)) +
    '<br><button class="mini" id="btnAllRange" style="margin-top:10px">ดูทุกช่วงเวลา</button>';
}
function wireEmptyMsg(){
  var ab = $('btnAllRange');
  if (ab) ab.onclick = function(){
    $('from').value=''; $('to').value='';
    if (RANGE) RANGE.set('', '');
    loadData();
  };
}

/** ตั้งช่วงเป็น "ทั้งเดือน" ของวันที่ที่ส่งมา แล้วดึงข้อมูลทันที */
function gotoMonthOf(iso){
  var m = String(iso||'').match(/^(\d{4})-(\d{2})-\d{2}$/); if (!m) return;
  var y = Number(m[1]), mo = Number(m[2]) - 1;
  var pad = function(v){ return (v<10?'0':'')+v; };
  var last = new Date(y, mo+1, 0).getDate();
  var f = y+'-'+pad(mo+1)+'-01', t = y+'-'+pad(mo+1)+'-'+pad(last);
  $('from').value = f; $('to').value = t;
  if (RANGE) RANGE.set(f, t);
  loadData();
}

function initRangePicker(){
  var d = DateRange.lastDays(7);
  $('from').value = d.from; $('to').value = d.to;
  RANGE = DateRange.attach($('rangeBtn'), {
    mode: 'filter',
    from: d.from, to: d.to,
    onApply: function (r){
      $('from').value = r.from; $('to').value = r.to;
      loadData();                      /* ยิงเฉพาะตอนกด "ใช้ช่วงนี้" หรือปุ่มลัด */
    }
  });
}

function showScreen(sc){
  S.screen = sc;
  $('loginScreen').style.display = sc==='login' ? 'flex' : 'none';
  $('dataScreen').style.display = sc==='data' ? 'block' : 'none';
  $('settingsScreen').style.display = sc==='settings' ? 'block' : 'none';
  renderNav();
}
function openSettings(){
  overlay(true,'กำลังโหลดการตั้งค่า…');
  google.script.run
    .withSuccessHandler(function(cfg){
      overlay(false);
      renderSettings(cfg);
      showScreen('settings');
    })
    .withFailureHandler(function(e){ overlay(false); toast(e && e.message ? e.message : e); })
    .getSettings(S.pin);
}
var SET = { cfg:null, tab:'A', dirty:{A:false,C:false,P:false} };

function setTab(t){
  var cur = SET.tab;
  if (cur !== t && SET.dirty[cur]){
    if (!confirm('แท็บนี้ยังมีของที่แก้แล้วไม่ได้บันทึก ออกจากแท็บนี้ไหม? (การแก้ไขจะหายไป)')) return;
    SET.dirty[cur] = false;
  }
  SET.tab = t;
  ['A','C','P'].forEach(function(k){
    $('tab'+k).classList.toggle('active', k===t);
    $('tab'+k).classList.toggle('dirty', !!SET.dirty[k]);
    $('pane'+k).classList.toggle('hidden', k!==t);
  });
}
function markDirty(k){ SET.dirty[k] = true; $('tab'+k).classList.add('dirty'); }
function clearDirty(k){ SET.dirty[k] = false; $('tab'+k).classList.remove('dirty'); }

function renderSettings(cfg){
  SET.cfg = cfg; SET.tab = 'A'; SET.dirty = {A:false,C:false,P:false};

  /* ---- แท็บ A: ป้ายแอป ---- */
  var A = '<div class="sec"><h3>ป้ายแอป</h3>'+
    '<div class="hint">ชื่อและคำอธิบายที่แสดงในแถบซ้ายและหน้าเข้าใช้งาน</div>'+
    '<div class="frow"><label>ชื่อแอป</label><input class="sin wide" id="setAppName" value="'+esc(cfg.appName||'')+'"></div>'+
    '<div class="frow"><label>คำอธิบาย</label><input class="sin wide" id="setAppDesc" value="'+esc(cfg.appDesc||'')+'" placeholder="เช่น Pattara Group · ฝ่ายบัญชี"></div>'+
    '<div class="frow"><label>ลิงก์คู่มือ</label><input class="sin wide" id="setManual" value="'+esc(cfg.manualUrl||'')+'" placeholder="https://docs.google.com/document/d/…"></div>'+
    '<div class="hint">เว้นลิงก์คู่มือว่างไว้ เมนูคู่มือจะถูกซ่อน</div>'+
    '<div class="frow"><label>เวอร์ชัน</label><span class="rdonly">'+esc(cfg.appVersion||'')+'</span>'+
      '<span style="font-size:11.5px;color:var(--mut)">ระบบเติมให้อัตโนมัติ ไม่มีช่องให้กรอก</span></div>'+
    '<div class="savebar"><button class="btn pri withico" id="btnSaveBrand">'+ICO('save')+'<span>บันทึกป้ายแอป</span></button></div>'+
    '</div>';

  /* ---- แท็บ C: การเชื่อมต่อ ---- */
  var C = '';
  (cfg.sources||[]).forEach(function(sc){
    var p = BOOTSTRAP.sources.filter(function(x){return x.key===sc.key;})[0];
    var dot = p ? '<span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:'+esc(p.color)+';margin-right:6px"></span>' : '';
    var chip = sc.hasToken
      ? '<span class="tokchip">ตั้งค่าแล้ว ('+esc(sc.tokenMask)+')</span>'
      : '<span class="tokchip none">ยังไม่ตั้งค่า</span>';
    C += '<div class="sec"><h3>'+dot+ICO('refresh-cw')+' '+esc(sc.label+' · '+sc.sublabel)+'</h3>'+
      '<div class="hint">URL มาจาก SyncEndpoint ในโปรเจกต์สคริปต์ของชีตนั้น (deploy เป็น Web app · ผู้ที่มีสิทธิ์เข้าถึง = ทุกคน)</div>'+
      '<div class="frow"><label>Sync URL</label><input class="sin wide" id="setUrl_'+esc(sc.key)+'" value="'+esc(sc.syncUrl||'')+'" placeholder="https://script.google.com/macros/s/…/exec"></div>'+
      '<div class="frow"><label>Sync Token</label>'+chip+
        '<button class="mini" id="btnTokChg_'+esc(sc.key)+'">เปลี่ยน Token</button></div>'+
      '<div class="frow hidden" id="rowTok_'+esc(sc.key)+'"><label>Token ใหม่</label>'+
        '<input class="sin wide" id="setToken_'+esc(sc.key)+'" placeholder="วางค่าใหม่ที่ได้จาก rotateSyncToken()">'+
        '<span style="font-size:11.5px;color:var(--mut)">เว้นว่าง = ไม่เปลี่ยนของเดิม</span></div>'+
      '<div class="savebar">'+
        '<button class="btn pri withico" id="btnSaveConn_'+esc(sc.key)+'">'+ICO('save')+'<span>บันทึก</span></button>'+
        '<button class="btn" id="btnTest_'+esc(sc.key)+'">ทดสอบการเชื่อมต่อ</button>'+
      '</div>'+
      '<div class="testout" id="testOut_'+esc(sc.key)+'"></div></div>';
  });

  /* ---- แท็บ P: เปลี่ยน PIN ---- */
  var P = '';
  if (cfg.pinIsDefault){
    P += '<div class="notice"><b>'+ICO('alert-triangle')+'PIN ผู้ดูแลยังเป็นค่าเริ่มต้น</b><br>'+
         'ใครก็เดาได้ กรุณาตั้ง PIN ใหม่ด้านล่าง</div>';
  }
  P += '<div class="sec"><h3>เปลี่ยน PIN ผู้ดูแล</h3>'+
    '<div class="frow"><label>PIN ใหม่</label><input class="sin" id="setPin" type="password" inputmode="numeric" maxlength="6" placeholder="ตัวเลข 6 หลัก"></div>'+
    '<div class="frow"><label>ยืนยัน PIN</label><input class="sin" id="setPin2" type="password" inputmode="numeric" maxlength="6" placeholder="พิมพ์ซ้ำอีกครั้ง"></div>'+
    '<div class="hint">เก็บแบบเข้ารหัส เปิดดูย้อนหลังไม่ได้ — ถ้าลืม ให้ผู้ดูแลเปิด Apps Script ของแอปนี้แล้วเรียกใช้ฟังก์ชัน resetAdminPin() · เปลี่ยนแล้วไม่ต้องออกจากระบบ</div>'+
    '<div class="savebar"><button class="btn pri withico" id="btnSavePin">'+ICO('save')+'<span>บันทึก PIN ใหม่</span></button></div>'+
    '</div>';

  $('settingsScreen').innerHTML =
    '<div class="setcard">'+
      '<div class="settings-head"><b style="font-size:16px">ตั้งค่าระบบ</b>'+
        '<button class="btn withico" id="btnSetBack">'+ICO('arrow-left')+'<span>กลับหน้าข้อมูล</span></button></div>'+
      '<div class="mtabs">'+
        '<button id="tabA" class="active">ป้ายแอป</button>'+
        '<button id="tabC">การเชื่อมต่อ</button>'+
        '<button id="tabP">เปลี่ยน PIN</button>'+
      '</div>'+
      '<div id="paneA">'+A+'</div>'+
      '<div id="paneC" class="hidden">'+C+'</div>'+
      '<div id="paneP" class="hidden">'+P+'</div>'+
    '</div>';

  $('btnSetBack').onclick = function(){
    var d = SET.dirty;
    if ((d.A||d.C||d.P) && !confirm('ยังมีของที่แก้แล้วไม่ได้บันทึก ออกจากหน้าตั้งค่าไหม?')) return;
    showScreen('data');
  };
  ['A','C','P'].forEach(function(k){ $('tab'+k).onclick = function(){ setTab(k); }; });

  ['setAppName','setAppDesc','setManual'].forEach(function(id){ $(id).oninput = function(){ markDirty('A'); }; });
  ['setPin','setPin2'].forEach(function(id){ $(id).oninput = function(){ markDirty('P'); }; });

  $('btnSaveBrand').onclick = saveBrand;
  $('btnSavePin').onclick = savePin;

  (cfg.sources||[]).forEach(function(sc){
    var k = sc.key;
    $('setUrl_'+k).oninput = function(){ markDirty('C'); };
    $('btnTokChg_'+k).onclick = function(){
      $('rowTok_'+k).classList.remove('hidden');
      $('setToken_'+k).focus();
      $('setToken_'+k).oninput = function(){ markDirty('C'); };
    };
    $('btnSaveConn_'+k).onclick = function(){ saveConn(k); };
    $('btnTest_'+k).onclick = function(){ testConn(k); };
  });
}

function busy(btn, on, textWhenBusy){
  if (!btn) return;
  btn.disabled = !!on;
  var sp = btn.querySelector('span');
  if (sp){
    if (on){ sp.setAttribute('data-old', sp.textContent); sp.textContent = textWhenBusy || 'กำลังบันทึก…'; }
    else if (sp.getAttribute('data-old')){ sp.textContent = sp.getAttribute('data-old'); }
  }
}

function saveBrand(){
  var b = $('btnSaveBrand');
  busy(b, true);
  google.script.run
    .withSuccessHandler(function(){
      busy(b, false); clearDirty('A');
      toast('บันทึกป้ายแอปแล้ว', true);
      BOOTSTRAP.manualUrl = $('setManual').value.trim();
      BOOTSTRAP.appName = $('setAppName').value.trim();
      $('appName').textContent = BOOTSTRAP.appName;
      renderNav(); fitAppName();
    })
    .withFailureHandler(function(e){ busy(b, false); toast('บันทึกไม่สำเร็จ: '+(e&&e.message?e.message:e)); })
    .saveSettings(S.pin, { section:'brand',
      appName: $('setAppName').value, appDesc: $('setAppDesc').value, manualUrl: $('setManual').value });
}

function saveConn(key){
  var b = $('btnSaveConn_'+key);
  var tokInp = $('setToken_'+key);
  busy(b, true);
  google.script.run
    .withSuccessHandler(function(){
      busy(b, false); clearDirty('C');
      toast('บันทึกการเชื่อมต่อแล้ว', true);
      openSettings();                       /* โหลดใหม่เพื่อให้ chip ของ token ตรงกับของจริง */
    })
    .withFailureHandler(function(e){ busy(b, false); toast('บันทึกไม่สำเร็จ: '+(e&&e.message?e.message:e)); })
    .saveSettings(S.pin, { section:'conn', sources:[{ key:key,
      syncUrl: $('setUrl_'+key).value, syncToken: tokInp ? tokInp.value : '' }] });
}

function savePin(){
  var b = $('btnSavePin'), np = $('setPin').value.trim(), cf = $('setPin2').value.trim();
  busy(b, true);
  google.script.run
    .withSuccessHandler(function(){
      busy(b, false); clearDirty('P');
      S.pin = np; $('setPin').value=''; $('setPin2').value='';
      toast('เปลี่ยน PIN เรียบร้อย ใช้ต่อได้เลยไม่ต้องออกจากระบบ', true);
      openSettings();
    })
    .withFailureHandler(function(e){ busy(b, false); toast(e && e.message ? e.message : e); })
    .saveSettings(S.pin, { section:'pin', newPin: np, confirmPin: cf });
}

function testConn(key){
  var b = $('btnTest_'+key), out = $('testOut_'+key);
  b.disabled = true; out.className = 'testout'; out.textContent = 'กำลังทดสอบ…';
  google.script.run
    .withSuccessHandler(function(r){
      b.disabled = false;
      out.className = 'testout ' + (r.ok ? 'ok' : 'bad');
      out.textContent = (r.ok ? 'ผ่าน — ' : 'ไม่ผ่าน — ') + r.message;
    })
    .withFailureHandler(function(e){
      b.disabled = false; out.className='testout bad';
      out.textContent = 'ไม่ผ่าน — ' + (e && e.message ? e.message : e);
    })
    .testSyncEndpoint(S.pin, key);
}

/* ---------- init / login ---------- */
function init(){
  var now=new Date();
  $('from').value=ymd(new Date(now.getFullYear(),now.getMonth(),1));
  $('to').value=ymd(now);

  $('btnLoad').onclick=loadData;
  $('btnSync').onclick=startSyncFlow;
  $('btnRebuild').onclick=startRebuildFlow;
  initRangePicker();
  $('btnLogout').onclick=logout;
  $('q').oninput=function(){ S.page=1; renderAll(); };
  $('store').onchange=function(){ S.page=1; renderAll(); };
  $('segRows').onclick=function(){ setView('rows'); };
  $('segDaily').onclick=function(){ setView('daily'); };
  $('segBranch').onclick=function(){ setView('branch'); };
  $('btnCsv').onclick=exportCsv;
  $('btnXlsx').onclick=exportXlsx;
  $('btnPrint').onclick=doPrint;
  $('btnIxEdit').onclick=startIxEdit;
  $('btnIxSave').onclick=saveIx;
  $('btnIxAdd').onclick=function(){
    var n=((srcObj()&&srcObj().indexFields)||[]).length||5;
    IX.push(new Array(n).fill('')); renderIxEditor();
  };
  $('btnIxCancel').onclick=function(){
    if (!confirm('ยกเลิกการแก้ไข? การแก้ไขที่ยังไม่บันทึกจะหายไป')) return;
    stopIxEdit(false);
  };

  $('btnEnterUser').onclick = function(){ enterApp('user'); };
  $('btnEnterAdmin').onclick = adminLogin;
  $('pin').addEventListener('input', function(){
    this.value = this.value.replace(/\D/g,'').slice(0,6);
    $('pinErr').textContent = '';
    if (this.value.length === 6) adminLogin();      /* ครบ 6 หลัก ส่งตรวจเลย ไม่ต้องกดปุ่ม */
  });
  $('pin').addEventListener('keydown', function(e){ if (e.key === 'Enter') adminLogin(); });

  initSidebar();
  initUserMenu();
  renderNav();
  renderSyncInfo();
  showScreen('login');

  fitAppName();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAppName);
  var w_; window.addEventListener('resize', function(){ clearTimeout(w_); w_ = setTimeout(fitAppName, 120); });
}
function pinFail(msg){
  var card = $('loginCard'), inp = $('pin');
  $('pinErr').textContent = msg;
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  inp.disabled = false; inp.value = ''; inp.focus();
}
function adminLogin(){
  var inp = $('pin'), pin = inp.value.trim();
  if (!/^\d{6}$/.test(pin)){ pinFail('PIN ต้องเป็นตัวเลข 6 หลัก'); return; }
  $('pinErr').textContent = '';
  inp.disabled = true;                                  // กันพิมพ์ซ้ำระหว่างรอตรวจ
  overlay(true,'กำลังตรวจสอบ PIN…');
  google.script.run
    .withSuccessHandler(function(){
      overlay(false); S.pin = pin; inp.disabled = false; inp.value=''; enterApp('admin');
    })
    .withFailureHandler(function(e){
      overlay(false); pinFail(e && e.message ? e.message : String(e));
    })
    .verifyPin(pin);
}
function logout(){
  if (S.ixEdit && !confirm('ออกจากระบบ? การแก้ไข Index ที่ยังไม่บันทึกจะหายไป')) return;
  S.role=null; S.pin=''; S.ixEdit=false; IX=[];
  S.headers=[]; S.rows=[]; S.latest=null; S.src=''; S.tab='';
  S.sortIdx=-1; S.page=1; S.view='rows';
  HEALTH=null; BRANCHES=[];
  $('q').value='';
  $('store').innerHTML='<option value="">ทุกสาขา</option>';
  var d0 = DateRange.lastDays(7);
  $('from').value=d0.from; $('to').value=d0.to;
  if (RANGE) RANGE.set(d0.from, d0.to);
  setNotice(''); $('healthBar').innerHTML=''; $('cards').innerHTML='';
  $('tbl').className='data'; $('tbl').innerHTML=''; $('pager').innerHTML='';
  $('segRows').className='on'; $('segDaily').className=''; $('segBranch').className='';
  $('pin').value=''; $('pinErr').textContent='';
  showScreen('login');
}
function enterApp(role){
  S.role = role;   /* แถบผู้ใช้บอก "สิทธิ์" ไม่ใช่ "ตัวตน" — ห้ามโชว์อีเมล (dual-access-login) */
  showScreen('data');
  selectSrc(BOOTSTRAP.sources[0].key);
}
document.addEventListener('DOMContentLoaded', init);
</script>
